<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>門市打卡</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, "Helvetica Neue", "PingFang TC", "Microsoft JhengHei", sans-serif;
           margin: 0; background: #fbf1e3; color: #4a3a2e; }
    .wrap { max-width: 480px; margin: 0 auto; padding: 22px 16px 48px; }
    h1 { font-size: 22px; text-align: center; margin: 10px 0 4px; color: #b8551f; }
    .who { text-align: center; font-size: 14px; color: #a96a3a; margin-bottom: 18px; min-height: 18px; }
    .card { background: #fffaf3; border-radius: 16px; padding: 20px; box-shadow: 0 4px 14px rgba(184,85,31,.10); border: 1px solid #f1ddc6; }
    label { display: block; font-size: 13px; color: #9a7a5e; margin: 16px 0 6px; font-weight: 600; }
    select { width: 100%; padding: 13px; font-size: 16px; border: 1.5px solid #e7cfb2; border-radius: 12px; background: #fffdfa; color: #4a3a2e; }
    .storebox { padding: 16px; font-size: 20px; text-align: center; border: 1.5px solid #e7cfb2; border-radius: 12px; background: #fff3e3; font-weight: 800; color: #c2541d; }
    .types { display: flex; gap: 10px; margin-top: 18px; }
    .types button { flex: 1; padding: 15px; font-size: 17px; border: 2px solid #e7cfb2; border-radius: 12px; background: #fffdfa; color: #8a6a4e; font-weight: 600; }
    .types button.on { border-color: #e07a3f; background: #fdeadd; color: #c2541d; }
    .submit { width: 100%; margin-top: 22px; padding: 17px; font-size: 19px; font-weight: 800; border: none; border-radius: 14px;
              background: linear-gradient(135deg,#ef8a44,#df6a2b); color: #fff; box-shadow: 0 4px 12px rgba(223,106,43,.35); }
    .submit:disabled { background: #e7c4a8; box-shadow: none; }
    .result { margin-top: 20px; border-radius: 14px; padding: 20px 16px; text-align: center; display: none; }
    .result .icon { font-size: 46px; line-height: 1; }
    .result .title { font-size: 22px; font-weight: 800; margin: 8px 0 4px; }
    .result .detail { font-size: 15px; line-height: 1.6; }
    .result.ok { background: #eaf7ec; border: 1.5px solid #9ed3a6; display: block; }
    .result.ok .title { color: #2e7d32; }
    .result.ok .detail { color: #3a6b3d; }
    .result.err { background: #fdeae2; border: 1.5px solid #f0b49c; display: block; }
    .result.err .title { color: #c0432a; }
    .result.err .detail { color: #a4492f; }
    .result.info { background: #fdf2e4; border: 1.5px solid #f0d6b0; display: block; }
    .result.info .title { color: #b5712f; font-size: 17px; }
    .today { margin-top: 20px; background: #fff6ea; border: 1px solid #f1ddc6; border-radius: 12px; padding: 14px 16px; display: none; }
    .today h3 { margin: 0 0 10px; font-size: 14px; color: #b8551f; }
    .today .row { display: flex; justify-content: space-between; font-size: 15px; padding: 5px 0; color: #5a4636; border-bottom: 1px dashed #eeddc8; }
    .today .row:last-child { border-bottom: none; }
    .today .t { font-weight: 700; color: #c2541d; }
    .today .empty { font-size: 14px; color: #b69a80; }
    .hint { font-size: 12px; color: #b69a80; margin-top: 16px; text-align: center; }
    #app { display: none; }
  </style>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <div class="wrap">
    <h1>🍲 門市打卡</h1>
    <div id="who" class="who"></div>
    <div id="app" class="card">
      <div id="bindBox" style="display:none">
        <label>首次使用，請選擇你的名字完成綁定</label>
        <select id="bindEmp"></select>
        <button id="bindBtn" class="submit">綁定我的 LINE</button>
      </div>
      <div id="punchBox" style="display:none">
        <label>店別</label>
        <div class="storebox" id="storeName">—</div>
        <div class="types">
          <button id="btnIn" class="on" data-type="上班">上班</button>
          <button id="btnOut" data-type="下班">下班</button>
        </div>
        <button id="submit" class="submit">打卡</button>
      </div>
      <div id="result" class="result"></div>
      <div id="today" class="today"></div>
      <div class="hint">需開啟定位權限</div>
    </div>
  </div>

<script>
  const LIFF_ID = '2010314288-Vh9dMEyC';
  const EXEC_URL = 'https://script.google.com/macros/s/AKfycbzGcQLml4LSMtGpCk14P7QT6Hn2eA4Mz0s-REha5O9IBXoUvgoxQIqnANsFOso7XRy6/exec';
  let ID_TOKEN = '';
  let PUNCH_TYPE = '上班';
  let STORE_ID = '';

  async function api(action, params) {
    const res = await fetch(EXEC_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action: action }, params || {}))
    });
    return await res.json();
  }

  liff.init({ liffId: LIFF_ID }).then(function () {
    if (!liff.isLoggedIn()) { liff.login(); return; }
    ID_TOKEN = liff.getIDToken();
    document.getElementById('app').style.display = 'block';
    loadData();
  }).catch(function (e) {
    document.getElementById('app').style.display = 'block';
    showResult('err', '❌', 'LINE 初始化失敗', String(e));
  });

  function loadData() {
    showResult('info', '⏳', '載入中…', '');
    api('bootstrap', { idToken: ID_TOKEN }).then(function (data) {
      if (!data.ok) { showResult('err', '❌', '載入失敗', data.error || ''); return; }
      hideResult();
      if (data.bound) {
        document.getElementById('punchBox').style.display = 'block';
        document.getElementById('who').textContent = '👤 ' + data.emp.name;
        STORE_ID = data.emp.store_id || '';
        var sname = data.emp.store_name || '';
        if (!STORE_ID || !sname) {
          // 後台未設定店別
          (data.stores || []).forEach(function (s) { if (s.store_id === STORE_ID) sname = s.store_name; });
        }
        if (STORE_ID) {
          document.getElementById('storeName').textContent = sname || STORE_ID;
        } else {
          document.getElementById('storeName').textContent = '尚未設定店別';
          document.getElementById('submit').disabled = true;
          showResult('err', '⚠️', '尚未設定店別', '請聯絡管理者在後台設定你的店別');
        }
        loadToday();
      } else {
        document.getElementById('who').textContent = '👤 ' + (data.line_name || '');
        document.getElementById('bindBox').style.display = 'block';
        const bindEmp = document.getElementById('bindEmp');
        (data.employees || []).forEach(function (e) { bindEmp.add(new Option(e.name, e.emp_id)); });
      }
    }).catch(function (e) { showResult('err', '❌', '載入錯誤', String(e)); });
  }

  function loadToday() {
    api('today', { idToken: ID_TOKEN }).then(function (data) {
      if (!data.ok) return;
      const box = document.getElementById('today');
      var html = '<h3>📋 今日打卡記錄（' + (data.date || '') + '）</h3>';
      if (!data.punches || data.punches.length === 0) {
        html += '<div class="empty">今天還沒有打卡記錄</div>';
      } else {
        data.punches.forEach(function (p) {
          html += '<div class="row"><span>' + p.type + '</span><span class="t">' + p.time + '</span></div>';
        });
      }
      box.innerHTML = html;
      box.style.display = 'block';
    }).catch(function () {});
  }

  document.getElementById('bindBtn').onclick = function () {
    const sel = document.getElementById('bindEmp');
    if (!sel.value) return showResult('err', '❌', '請選擇你的名字', '');
    this.disabled = true;
    showResult('info', '⏳', '綁定中…', '');
    api('bind', { idToken: ID_TOKEN, emp_id: sel.value }).then(function (res) {
      if (res.ok) { showResult('ok', '✅', '綁定成功', res.name + '，即將進入打卡'); setTimeout(function () { location.reload(); }, 1500); }
      else { document.getElementById('bindBtn').disabled = false; showResult('err', '❌', '綁定失敗', res.reason || ''); }
    }).catch(function (e) { document.getElementById('bindBtn').disabled = false; showResult('err', '❌', '綁定錯誤', String(e)); });
  };

  document.getElementById('btnIn').onclick = function () { setType('上班', this); };
  document.getElementById('btnOut').onclick = function () { setType('下班', this); };
  function setType(t, btn) { PUNCH_TYPE = t; document.querySelectorAll('.types button').forEach(function (b) { b.classList.remove('on'); }); btn.classList.add('on'); }

  function getPosition() {
    return new Promise(function (resolve, reject) {
      if (!navigator.geolocation) return reject(new Error('此裝置不支援定位'));
      navigator.geolocation.getCurrentPosition(
        function (p) { resolve({ lat: p.coords.latitude, lng: p.coords.longitude, accuracy: p.coords.accuracy }); },
        function (err) { reject(new Error(err.code === 1 ? '請允許定位權限後重試' : '無法取得定位，請重試')); },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    });
  }
  async function getClientIp() {
    try { const r = await fetch('https://api.ipify.org?format=json'); return (await r.json()).ip; } catch (e) { return ''; }
  }

  document.getElementById('submit').onclick = async function () {
    const btn = this;
    if (!STORE_ID) return showResult('err', '❌', '尚未設定店別', '請聯絡管理者');
    btn.disabled = true;
    showResult('info', '📍', '定位中…請稍候', '');
    try {
      const pos = await getPosition();
      const ip = await getClientIp();
      const res = await api('punch', {
        idToken: ID_TOKEN, store_id: STORE_ID, type: PUNCH_TYPE,
        lat: pos.lat, lng: pos.lng, accuracy: Math.round(pos.accuracy),
        client_ip: ip, user_agent: navigator.userAgent
      });
      btn.disabled = false;
      var storeName = document.getElementById('storeName').textContent;
      if (res.ok) {
        showResult('ok', '✅', PUNCH_TYPE + '打卡成功', (res.name || '') + '｜' + storeName + '\n' + res.time);
        loadToday();
      } else {
        showResult('err', '❌', PUNCH_TYPE + '打卡失敗', res.reason || '');
      }
    } catch (e) { btn.disabled = false; showResult('err', '❌', '打卡失敗', e.message || String(e)); }
  };

  function showResult(type, icon, title, detail) {
    const r = document.getElementById('result');
    r.className = 'result ' + type;
    r.innerHTML = '<div class="icon">' + icon + '</div><div class="title">' + title + '</div>' +
                  (detail ? '<div class="detail">' + detail + '</div>' : '');
  }
  function hideResult() { document.getElementById('result').className = 'result'; }
</script>
</body>
</html>
