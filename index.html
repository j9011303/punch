<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>門市打卡</title>

  <link rel="preconnect" href="https://static.line-scdn.net">
  <link rel="preconnect" href="https://script.google.com">
  <link rel="dns-prefetch" href="https://api.ipify.org">

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { background: #fbf1e3; }
    body { font-family: -apple-system, "Helvetica Neue", "PingFang TC", "Microsoft JhengHei", sans-serif;
           margin: 0; color: #4a3a2e; }
    .wrap { max-width: 480px; margin: 0 auto; padding: 22px 16px 48px; }
    h1 { font-size: 22px; text-align: center; margin: 10px 0 4px; color: #b8551f; }
    .who { text-align: center; font-size: 14px; color: #a96a3a; margin-bottom: 18px; min-height: 18px; }
    .card { background: #fffaf3; border-radius: 16px; padding: 20px; box-shadow: 0 4px 14px rgba(184,85,31,.10); border: 1px solid #f1ddc6; }
    label { display: block; font-size: 13px; color: #9a7a5e; margin: 16px 0 6px; font-weight: 600; }
    select { width: 100%; padding: 13px; font-size: 16px; border: 1.5px solid #e7cfb2; border-radius: 12px; background: #fffdfa; color: #4a3a2e; }
    .storebox { padding: 16px; font-size: 20px; text-align: center; border: 1.5px solid #e7cfb2; border-radius: 12px; background: #fff3e3; font-weight: 800; color: #c2541d; }
    .submit { width: 100%; margin-top: 22px; padding: 17px; font-size: 19px; font-weight: 800; border: none; border-radius: 14px;
              background: linear-gradient(135deg,#ef8a44,#df6a2b); color: #fff; box-shadow: 0 4px 12px rgba(223,106,43,.35); }
    .submit:disabled { background: #e7c4a8; box-shadow: none; }
    .result { margin-top: 20px; border-radius: 14px; padding: 20px 16px; text-align: center; display: none; }
    .result .icon { font-size: 46px; line-height: 1; }
    .result .title { font-size: 22px; font-weight: 800; margin: 8px 0 4px; }
    .result .detail { font-size: 15px; line-height: 1.6; white-space: pre-line; }
    .result.ok { background: #eaf7ec; border: 1.5px solid #9ed3a6; display: block; }
    .result.ok .title { color: #2e7d32; }
    .result.ok .detail { color: #3a6b3d; }
    .result.err { background: #fdeae2; border: 1.5px solid #f0b49c; display: block; }
    .result.err .title { color: #c0432a; }
    .result.err .detail { color: #a4492f; }
    .result.info { background: #fdf2e4; border: 1.5px solid #f0d6b0; display: block; }
    .result.info .title { color: #b5712f; font-size: 17px; }
    .today { margin-top: 20px; background: #fff6ea; border: 1px solid #f1ddc6; border-radius: 12px; padding: 14px 16px; display: none; }
    .today h3 { margin: 0 0 10px; font-size: 14px; color: #b8551f; }
    .today .row { display: flex; justify-content: space-between; font-size: 15px; padding: 5px 0; color: #5a4636; border-bottom: 1px dashed #eeddc8; }
    .today .row:last-child { border-bottom: none; }
    .today .t { font-weight: 700; color: #c2541d; }
    .today .empty { font-size: 14px; color: #b69a80; }
    .hint { font-size: 12px; color: #b69a80; margin-top: 16px; text-align: center; }
    #boot { text-align: center; padding: 30px 16px; color: #a96a3a; font-size: 15px; }
    #boot .retry { display: inline-block; margin-top: 14px; padding: 12px 22px; border-radius: 12px; border: none;
                   background: linear-gradient(135deg,#ef8a44,#df6a2b); color: #fff; font-size: 16px; font-weight: 700; }
    #app { display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🍲 門市打卡</h1>

    <!-- 先畫出來，確保螢幕不會一片黑 -->
    <div id="boot">⏳ 載入中…請稍候</div>

    <div id="who" class="who"></div>
    <div id="app" class="card">
      <div id="bindBox" style="display:none">
        <label>首次使用，請選擇你的名字完成綁定</label>
        <select id="bindEmp"></select>
        <button id="bindBtn" class="submit">綁定我的 LINE</button>
      </div>
      <div id="punchBox" style="display:none">
        <label>店別</label>
        <div class="storebox" id="storeName">—</div>
        <button id="submit" class="submit">打卡</button>
      </div>
      <div id="result" class="result"></div>
      <div id="today" class="today"></div>
      <div class="hint">需開啟定位權限</div>
    </div>
  </div>
<script>
  const LIFF_ID = '2010314288-Vh9dMEyC';
  const EXEC_URL = 'https://script.google.com/macros/s/AKfycbzGcQLml4LSMtGpCk14P7QT6Hn2eA4Mz0s-REha5O9IBXoUvgoxQIqnANsFOso7XRy6/exec';
  const SDK_URL = 'https://static.line-scdn.net/liff/edge/2/sdk.js';
  let ID_TOKEN = '';
  let PUNCH_TYPE = '打卡';
  let STORE_ID = '';
  let CACHED_POS = null;
  let CACHED_IP = '';

  function safeGetCache(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function safeSetCache(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }

  function hideBoot() { var b = document.getElementById('boot'); if (b) b.style.display = 'none'; }
  function showBootError(msg) {
    var b = document.getElementById('boot');
    if (!b) return;
    b.style.display = 'block';
    b.innerHTML = '😵 ' + msg + '<br><button class="retry" onclick="location.reload()">重新載入</button>';
  }

  async function api(action, params) {
    const res = await fetch(EXEC_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action: action }, params || {}))
    });
    return await res.json();
  }

  function startContinuousPositioning() {
    if (!navigator.geolocation) return;
    navigator.geolocation.watchPosition(
      function (p) { CACHED_POS = { lat: p.coords.latitude, lng: p.coords.longitude, accuracy: p.coords.accuracy }; },
      function (error) { console.log('定位失敗：' + error.message); },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 5000 }
    );
  }

  // ✅ 取得「真實」定位：有有效快取就用，否則現場主動定位並等待；失敗回傳 null（絕不送 0,0）
  function getPositionStrict(timeoutMs) {
    return new Promise(function (resolve) {
      if (CACHED_POS && CACHED_POS.lat && CACHED_POS.lng) return resolve(CACHED_POS);
      if (!navigator.geolocation) return resolve(null);
      navigator.geolocation.getCurrentPosition(
        function (p) {
          var pos = { lat: p.coords.latitude, lng: p.coords.longitude, accuracy: p.coords.accuracy };
          CACHED_POS = pos;
          resolve(pos);
        },
        function () { resolve(null); },
        { enableHighAccuracy: true, timeout: timeoutMs, maximumAge: 3000 }
      );
    });
  }

  function preloadClientIp() {
    Promise.race([
      fetch('https://api.ipify.org?format=json').then(r => r.json()),
      new Promise((_, reject) => setTimeout(() => reject(), 2000))
    ]).then(data => { CACHED_IP = data.ip; }).catch(() => { CACHED_IP = ''; });
  }

  function showCachedData() {
    const cached = safeGetCache('punchCache');
    if (!cached) return;
    try {
      const data = JSON.parse(cached);
      if (data.bound) {
        hideBoot();
        document.getElementById('app').style.display = 'block';
        document.getElementById('punchBox').style.display = 'block';
        document.getElementById('who').textContent = '👤 ' + data.emp.name;
        STORE_ID = data.emp.store_id || '';
        document.getElementById('storeName').textContent = data.emp.store_name || STORE_ID;
        renderTodayData(data);
      }
    } catch (e) {}
  }

  // 各自獨立 try，互不拖累
  try { showCachedData(); } catch (e) {}
  try { startContinuousPositioning(); } catch (e) {}
  try { preloadClientIp(); } catch (e) {}

  // ✅ 動態載入 LIFF SDK（不阻塞頁面渲染）+ 逾時保護
  function bootLiff() {
    if (typeof liff !== 'undefined') return initLiff();

    var done = false;
    var watchdog = setTimeout(function () {
      if (done) return;
      done = true;
      showBootError('網路載入逾時，請確認連線後重試');
    }, 12000); // 12 秒還載不到 SDK 就提示，而不是黑畫面

    var s = document.createElement('script');
    s.src = SDK_URL;
    s.async = true;
    s.onload = function () { if (done) return; done = true; clearTimeout(watchdog); initLiff(); };
    s.onerror = function () { if (done) return; done = true; clearTimeout(watchdog); showBootError('無法載入 LINE 元件，請確認網路後重試'); };
    document.head.appendChild(s);
  }

  function initLiff() {
    liff.init({ liffId: LIFF_ID }).then(function () {
      if (!liff.isLoggedIn()) { liff.login(); return; }
      ID_TOKEN = liff.getIDToken();
      hideBoot();
      document.getElementById('app').style.display = 'block';
      loadData();
    }).catch(function (e) {
      hideBoot();
      document.getElementById('app').style.display = 'block';
      showResult('err', '❌', 'LINE 初始化失敗', String(e));
    });
  }

  bootLiff();

  async function loadData() {
    showResult('info', '⏳', '載入中…', '');
    try {
      const data = await api('bootstrap', { idToken: ID_TOKEN });
      if (!data.ok) { showResult('err', '❌', '載入失敗', data.error || ''); return; }

      if (data.bound) {
        document.getElementById('punchBox').style.display = 'block';
        document.getElementById('who').textContent = '👤 ' + data.emp.name;
        STORE_ID = data.emp.store_id || '';
        let sname = data.emp.store_name || '';

        if (!STORE_ID || !sname) {
          (data.stores || []).forEach(function (s) { if (s.store_id === STORE_ID) sname = s.store_name; });
        }

        if (STORE_ID) {
          document.getElementById('storeName').textContent = sname || STORE_ID;
        } else {
          document.getElementById('storeName').textContent = '尚未設定店別';
          document.getElementById('submit').disabled = true;
          showResult('err', '⚠️', '尚未設定店別', '請聯絡管理者在後台設定你的店別');
        }

        renderTodayData(data);
        safeSetCache('punchCache', JSON.stringify(data));
      } else {
        document.getElementById('who').textContent = '👤 ' + (data.line_name || '');
        document.getElementById('bindBox').style.display = 'block';
        const bindEmp = document.getElementById('bindEmp');
        (data.employees || []).forEach(function (e) { bindEmp.add(new Option(e.name, e.emp_id)); });
      }

      hideResult();
    } catch (e) {
      showResult('err', '❌', '載入錯誤', String(e));
    }
  }

  function renderTodayData(data) {
    const box = document.getElementById('today');
    if (!data || !data.ok) return;

    let html = '<h3>📋 今日打卡記錄（' + (data.date || '') + '）</h3>';
    if (!data.punches || data.punches.length === 0) {
      html += '<div class="empty">今天還沒有打卡記錄</div>';
    } else {
      data.punches.forEach(function (p) {
        html += '<div class="row"><span>' + p.type + '</span><span class="t">' + p.time + '</span></div>';
      });
    }
    box.innerHTML = html;
    box.style.display = 'block';
  }

  document.getElementById('bindBtn').onclick = function () {
    const sel = document.getElementById('bindEmp');
    if (!sel.value) return showResult('err', '❌', '請選擇你的名字', '');
    this.disabled = true;
    showResult('info', '⏳', '綁定中…', '');
    api('bind', { idToken: ID_TOKEN, emp_id: sel.value }).then(function (res) {
      if (res.ok) { showResult('ok', '✅', '綁定成功', res.name + '，即將進入打卡'); setTimeout(function () { location.reload(); }, 1500); }
      else { document.getElementById('bindBtn').disabled = false; showResult('err', '❌', '綁定失敗', res.reason || ''); }
    }).catch(function (e) { document.getElementById('bindBtn').disabled = false; showResult('err', '❌', '綁定錯誤', String(e)); });
  };

  document.getElementById('submit').onclick = async function () {
    const btn = this;
    if (!STORE_ID) return showResult('err', '❌', '尚未設定店別', '請聯絡管理者');
    btn.disabled = true;

    try {
      // 1️⃣ 先確認拿到真實座標；沒有就現場定位並等待（不再送 0,0）
      let pos = (CACHED_POS && CACHED_POS.lat && CACHED_POS.lng) ? CACHED_POS : null;
      if (!pos) {
        showResult('info', '📍', '定位中…請稍候', '正在取得你的位置，約需 2~5 秒\n若一直定位不到，請靠近門口或窗邊');
        pos = await getPositionStrict(15000);
      }

      // 2️⃣ 送出：有座標就帶座標；真的定不到位就帶 null（交給後端用 WiFi/IP 判斷或回明確訊息），絕不送 0,0
      showResult('info', '⏳', '打卡中…', '');
      const box = document.getElementById('today');
      box.innerHTML = '<h3>📋 今日打卡紀錄</h3><div style="text-align:center; padding: 20px; color: #999;">⏳ 更新中...</div>';
      box.style.display = 'block';

      const res = await api('punch', {
        idToken: ID_TOKEN, store_id: STORE_ID, type: PUNCH_TYPE,
        lat: pos ? pos.lat : null,
        lng: pos ? pos.lng : null,
        accuracy: pos ? Math.round(pos.accuracy) : null,
        client_ip: CACHED_IP, user_agent: navigator.userAgent
      });

      btn.disabled = false;
      const storeName = document.getElementById('storeName').textContent;

      if (res.ok) {
        showResult('ok', '✅', '打卡成功', (res.name || '') + '｜' + storeName + '\n' + res.time);
        renderTodayData(res);
        safeSetCache('punchCache', JSON.stringify(res));
      } else {
        showResult('err', '❌', '打卡失敗', res.reason || '');
        api('today', { idToken: ID_TOKEN }).then(renderTodayData);
      }
    } catch (e) {
      btn.disabled = false;
      showResult('err', '❌', '打卡失敗', e.message || String(e));
    }
  };

  function showResult(type, icon, title, detail) {
    const r = document.getElementById('result');
    r.className = 'result ' + type;
    r.innerHTML = '<div class="icon">' + icon + '</div><div class="title">' + title + '</div>' +
                  (detail ? '<div class="detail">' + detail + '</div>' : '');
  }

  function hideResult() {
    document.getElementById('result').className = 'result';
  }
</script>
</body>
</html>
